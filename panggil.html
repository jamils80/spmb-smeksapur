<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pemanggil Antrian</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Poppins', sans-serif; text-align: center; padding: 20px; }
    .card-main { border-radius: 30px; width: 100%; max-width: 550px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); overflow: hidden; border: none; }
    .header-area { background: #fff9c4; padding: 25px 30px; border-bottom: 4px solid #f1c40f; }
    .logo-wrapper { display: flex; justify-content: space-between; align-items: center; gap: 15px; }
    .logo-img { width: 45%; height: auto; object-fit: contain; }
    .content-area { padding: 30px; background: #e0f7fa; color: #2d3436; }
    .badge-loket { background: #1e3c72; color: white; padding: 8px 25px; border-radius: 50px; font-weight: 800; font-size: 1rem; display: inline-block; margin-bottom: 10px; box-shadow: 0 4px 10px rgba(30, 60, 114, 0.2); }
    .num-display { font-size: 7.5rem; font-weight: 900; color: #1e3c72; line-height: 1; margin: 15px 0; }
    .info-box { background: #ffffff; border-radius: 15px; padding: 20px; min-height: 110px; display: flex; flex-direction: column; justify-content: center; border: 1px solid #b2ebf2; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .btn-panggil { background: #2ecc71; color: white; border: none; border-radius: 15px; padding: 15px; font-weight: 800; transition: 0.3s; margin-top: 20px; font-size: 1.1rem; box-shadow: 0 6px 15px rgba(46, 204, 113, 0.3); }
    .btn-panggil:hover { background: #27ae60; transform: translateY(-2px); color: white; }
    .btn-recall { background: #e67e22; color: white; border: none; border-radius: 15px; padding: 12px; font-weight: 800; transition: 0.3s; margin-top: 12px; font-size: 1rem; box-shadow: 0 6px 15px rgba(230, 126, 34, 0.3); }
    .btn-recall:hover { background: #d35400; transform: translateY(-2px); color: white; }
  </style>
</head>
<body>
  <div class="card-main">
    <div class="header-area">
      <div class="logo-wrapper">
        <img src="https://lh3.googleusercontent.com/d/1MZz8aioQlkFozWDJ1Y7Z1tRj_nZCSWO0" class="logo-img" alt="Logo Jatim">
        <img src="https://lh3.googleusercontent.com/d/1gj5Xy_Gk9UHulau-_vf3IZuYlQtQN6Jz" class="logo-img" alt="Logo SMKN">
      </div>
    </div>
    <div class="content-area">
      <span class="badge-loket" id="labelLoket">OPERATOR ...</span>
      <div class="num-display" id="num">-</div>
      <div class="info-box">
        <h4 id="namaDisplay" class="fw-bold mb-1">Menunggu...</h4>
        <p id="sekolahDisplay" class="text-muted mb-0"></p>
      </div>
      
      <button class="btn btn-panggil w-100" onclick="panggilNext()">PANGGIL BERIKUTNYA</button>
      <button class="btn btn-recall w-100" onclick="panggilUlang()">PANGGIL ULANG (RECALL)</button>
    </div>
  </div>

  <script>
    const RAW_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyhZQOFsuclwetmdyAMkmG-X3DNGId7i-Of_bWGk8DWL4Bb_zS-ngFTzveVs3h9VvH5/exec";
    const WEB_APP_URL = RAW_WEB_APP_URL.replace(/\/u\/\d+\//, '/');

    const params = new URLSearchParams(window.location.search);
    let rawLoket = (params.get('l') || "A").toUpperCase().trim();

    const konversiAngkaKeHuruf = {
      "1": "A", "2": "B", "3": "C", "4": "D", "5": "E",
      "6": "F", "7": "G", "8": "H", "9": "I", "10": "J"
    };

    if (konversiAngkaKeHuruf[rawLoket]) {
      rawLoket = konversiAngkaKeHuruf[rawLoket];
    }

    const myLoket = rawLoket; 
    document.getElementById('labelLoket').innerText = "OPERATOR " + myLoket;

    let currentAntrian = { nomor: "-", nama: "", sekolah: "" };

    function panggilNext() {
      const btn = document.querySelector('.btn-panggil');
      btn.innerText = "MEMPROSES..."; btn.disabled = true;
      
      fetch(`${WEB_APP_URL}?action=panggilAntrian&loket=${encodeURIComponent(myLoket)}`)
        .then(res => res.json())
        .then(res => {
          btn.innerText = "PANGGIL BERIKUTNYA"; btn.disabled = false;
          if(res.success) {
            document.getElementById('num').innerText = res.nomor;
            document.getElementById('namaDisplay').innerText = res.nama;
            document.getElementById('sekolahDisplay').innerText = res.sekolah;
            
            currentAntrian.nomor = res.nomor;
            currentAntrian.nama = res.nama;
            currentAntrian.sekolah = res.sekolah;
          } else {
            alert(res.message);
          }
        })
        .catch(err => {
          btn.innerText = "PANGGIL BERIKUTNYA"; btn.disabled = false;
          alert("Gagal memanggil antrian!");
        });
    }

    function panggilUlang() {
      if (currentAntrian.nomor === "-") {
        alert("Belum ada data nomor antrian yang aktif untuk dipanggil ulang!");
        return;
      }
      
      const btnRecall = document.querySelector('.btn-recall');
      btnRecall.innerText = "MEMANGGIL ULANG..."; btnRecall.disabled = true;
      
      fetch(WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: "tambahAntrianPanggilUlang",
          nomor: currentAntrian.nomor,
          nama: currentAntrian.nama,
          sekolah: currentAntrian.sekolah,
          loket: myLoket
        })
      })
      .then(res => res.json())
      .then(() => {
        btnRecall.innerText = "PANGGIL ULANG (RECALL)"; btnRecall.disabled = false;
      })
      .catch(() => {
        btnRecall.innerText = "PANGGIL ULANG (RECALL)"; btnRecall.disabled = false;
      });
    }
  </script>
</body>
</html>
