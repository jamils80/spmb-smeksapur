<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Antrian SPMB - SMKN 1 Purwoasri</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      color: white;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .main-card {
      background: rgba(255, 255, 255, 0.95);
      color: #2d3436;
      border-radius: 25px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 500px;
      padding: 35px 25px;
      text-align: center;
    }
    .logo-img {
      height: 60px;
      width: auto;
      object-fit: contain;
    }
    .btn-portal {
      border-radius: 15px;
      padding: 15px;
      font-weight: 700;
      font-size: 1.05rem;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 15px;
      text-decoration: none;
    }
    .btn-ambil { background: #1e3c72; color: white; border: none; }
    .btn-ambil:hover { background: #162d55; color: white; transform: translateY(-2px); }
    
    .btn-display { background: #e67e22; color: white; border: none; }
    .btn-display:hover { background: #d35400; color: white; transform: translateY(-2px); }

    .btn-operator { background: #2ed573; color: white; border: none; }
    .btn-operator:hover { background: #26af5f; color: white; transform: translateY(-2px); }
  </style>
</head>
<body>

  <div class="main-card">
    <div class="d-flex justify-content-center gap-3 mb-3">
      <img src="https://lh3.googleusercontent.com/d/1MZz8aioQlkFozWDJ1Y7Z1tRj_nZCSWO0" class="logo-img" alt="Logo Pemprov">
      <img src="https://lh3.googleusercontent.com/d/1gj5Xy_Gk9UHulau-_vf3IZuYlQtQN6Jz" class="logo-img" alt="Logo SMKN">
    </div>

    <h4 class="fw-bold mb-1 text-primary">PORTAL ANTRIAN SPMB</h4>
    <p class="text-muted small mb-4">SMK Negeri 1 Purwoasri Kediri</p>

    <div class="d-grid gap-2">
      <!-- Tombol 1: Ambil Nomor Antrian -->
      <a href="ambil.html" class="btn btn-portal btn-ambil">
        <i class="fa-solid fa-ticket fs-4"></i>
        <span>Ambil Nomor Antrian</span>
      </a>

      <!-- Tombol 2: Display Monitor Utama -->
      <a href="display.html" class="btn btn-portal btn-display">
        <i class="fa-solid fa-tv fs-4"></i>
        <span>Layar Monitor Display</span>
      </a>

      <!-- Tombol 3: Login Operator -->
      <a href="operator.html" class="btn btn-portal btn-operator">
        <i class="fa-solid fa-user-gear fs-4"></i>
        <span>Portal Login Operator</span>
      </a>
    </div>

    <div class="mt-4 pt-2 border-top text-muted small">
      &copy; 2026 | SMKN 1 Purwoasri
    </div>
  </div>

</body>
</html>
