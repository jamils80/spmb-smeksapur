<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Operator SPMB</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #2c3e50; color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: sans-serif; }
    .login-card { background: #34495e; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 450px; text-align: center; }
    .btn-loket { background: #3498db; border: none; margin: 5px; width: 65px; height: 65px; border-radius: 10px; font-weight: bold; color: white; font-size: 1.2rem; transition: 0.2s; }
    .btn-loket.active { background: #e67e22; transform: scale(1.1); box-shadow: 0 0 15px rgba(230, 126, 34, 0.6); }
  </style>
</head>
<body>
  <div class="login-card">
    <h2 class="mb-4">LOGIN OPERATOR</h2>
    
    <div class="d-flex flex-wrap justify-content-center mb-4">
      <script>
        const listOps = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J'];
        for (let i = 0; i < listOps.length; i++) {
          document.write(`<button class="btn btn-loket" onclick="selectLoket('${listOps[i]}', this)">${listOps[i]}</button>`);
        }
      </script>
    </div>
    
    <input type="password" id="pin" class="form-control text-center mb-3" placeholder="PIN (1234)">
    <button class="btn btn-success w-100 fw-bold" id="btnLogin" onclick="login()">MASUK</button>
  </div>

  <script>
    const RAW_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyhZQOFsuclwetmdyAMkmG-X3DNGId7i-Of_bWGk8DWL4Bb_zS-ngFTzveVs3h9VvH5/exec";
    const WEB_APP_URL = RAW_WEB_APP_URL.replace(/\/u\/\d+\//, '/');

    let selectedLoket = null;
    
    function selectLoket(hurufOp, btn) {
      selectedLoket = hurufOp;
      document.querySelectorAll('.btn-loket').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function login() {
      const pin = document.getElementById('pin').value;
      const btn = document.getElementById('btnLogin');
      if(!selectedLoket || !pin) return alert('Pilih Operator dan masukan PIN!');
      
      btn.innerText = "Memproses...";
      btn.disabled = true;

      fetch(WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify({ action: "cekLogin", loket: selectedLoket, pin: pin })
      })
      .then(res => res.json())
      .then(res => {
        if(res && res.success) {
          window.location.href = `panggil.html?l=${selectedLoket}`;
        } else {
          alert(res ? res.message : "PIN Salah!");
          btn.innerText = "MASUK";
          btn.disabled = false;
        }
      })
      .catch(err => {
        alert("Gagal terhubung ke server!");
        btn.innerText = "MASUK";
        btn.disabled = false;
      });
    }
  </script>
</body>
</html>
