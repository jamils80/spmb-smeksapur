<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ambil Antrian SPMB</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Poppins', sans-serif; margin: 0; padding: 20px; }
    .card-main { border: none; border-radius: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); width: 100%; max-width: 550px; overflow: hidden; }
    .header-area { background: #e3f2fd; padding: 25px 30px; border-bottom: 4px solid #3498db; }
    .logo-wrapper { display: flex; justify-content: space-between; align-items: center; gap: 15px; }
    .logo-img { width: 45%; height: auto; object-fit: contain; }
    .content-area { padding: 35px; background: #f0fff4; color: #2d3436; }
    .garis-pemisah { border: 0; height: 3px; background-image: linear-gradient(to right, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0)); margin: 25px 0; }
    .form-label { font-weight: 700; color: #2d3436; margin-bottom: 5px; }
    .form-control, .form-select { border-radius: 12px; padding: 12px; border: 1px solid #c3dae8; background: #ffffff; }
    .btn-ambil { background: #1e3c72; color: white; font-weight: 800; border: none; border-radius: 15px; padding: 15px; margin-top: 10px; transition: 0.3s; box-shadow: 0 4px 15px rgba(30, 60, 114, 0.3); }
    .btn-ambil:hover { background: #162d55; transform: translateY(-2px); color: white; }
    #res { font-size: 5.5rem; color: #1e3c72; line-height: 1; margin: 20px 0; font-weight: 900; }
  </style>
</head>
<body>
  <div class="card-main">
    <div class="header-area text-center">
      <div class="logo-wrapper">
        <img src="https://lh3.googleusercontent.com/d/1MZz8aioQlkFozWDJ1Y7Z1tRj_nZCSWO0" class="logo-img" alt="Logo Jatim">
        <img src="https://lh3.googleusercontent.com/d/1gj5Xy_Gk9UHulau-_vf3IZuYlQtQN6Jz" class="logo-img" alt="Logo SMKN">
      </div>
    </div>
    <div class="content-area">
      <div id="formArea">
        <h4 class="text-center fw-bold mb-1">AMBIL NOMOR ANTRIAN</h4>
        <h5 class="text-center fw-bold mb-4">SPMB 2026 - SMKN 1 PURWOASRI</h5>
        <hr class="garis-pemisah">
        <div class="mb-3">
          <label class="form-label">Nama Lengkap Calon Siswa</label>
          <input type="text" id="nama" class="form-control" placeholder="Ketik nama di sini...">
        </div>
        <div class="mb-3">
          <label class="form-label">Asal Sekolah (SMP/MTs)</label>
          <input type="text" id="sekolah" class="form-control" placeholder="Ketik asal sekolah...">
        </div>
        <div class="mb-3">
          <label class="form-label">Operator Verifikasi</label>
          <select id="operatorTujuan" class="form-select">
            <option value="" selected disabled>-- Pilih Operator --</option>
            <script>
              const ops = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J'];
              for (let i = 0; i < ops.length; i++) {
                document.write(`<option value="${ops[i]}">OPERATOR ${ops[i]}</option>`);
              }
            </script>
          </select>
        </div>
        <button class="btn btn-ambil w-100" onclick="ambil()">AMBIL NOMOR ANTRIAN SEKARANG</button>
      </div>
      <div id="resultArea" style="display:none;" class="text-center">
        <h5 class="text-muted fw-bold">NOMOR ANTRIAN ANDA:</h5>
        <div id="res"></div>
        <p class="text-secondary small">Silakan simpan nomor ini untuk dipanggil nanti.</p>
        <hr>
        <button class="btn btn-primary w-100 rounded-pill" onclick="resetForm()">KEMBALI</button>
      </div>
    </div>
  </div>

  <script>
    const RAW_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyhZQOFsuclwetmdyAMkmG-X3DNGId7i-Of_bWGk8DWL4Bb_zS-ngFTzveVs3h9VvH5/exec"; // Ganti ID Deployment Apps Script Anda
    const WEB_APP_URL = RAW_WEB_APP_URL.replace(/\/u\/\d+\//, '/');

    function ambil() {
      const n = document.getElementById('nama').value.trim();
      const s = document.getElementById('sekolah').value.trim();
      const o = document.getElementById('operatorTujuan').value;
      const btn = document.querySelector('.btn-ambil');
      
      if(!n || !s || !o) { alert('Harap lengkapi semua data!'); return; }
      btn.innerText = "SEDANG MENGAMBIL..."; btn.disabled = true;

      fetch(WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify({ action: "tambahAntrian", nama: n, sekolah: s, loket: o })
      })
      .then(res => res.json())
      .then(res => {
        if(res.success) {
          document.getElementById('formArea').style.display = "none";
          document.getElementById('resultArea').style.display = "block";
          document.getElementById('res').innerText = res.nomor;
        } else {
          alert("Gagal mengambil antrian!");
          btn.innerText = "AMBIL NOMOR ANTRIAN SEKARANG"; btn.disabled = false;
        }
      })
      .catch(err => {
        alert("Gagal terhubung ke server!");
        btn.innerText = "AMBIL NOMOR ANTRIAN SEKARANG"; btn.disabled = false;
      });
    }

    function resetForm() {
      document.getElementById('nama').value = "";
      document.getElementById('sekolah').value = "";
      document.getElementById('operatorTujuan').selectedIndex = 0;
      document.getElementById('formArea').style.display = "block";
      document.getElementById('resultArea').style.display = "none";
      const btn = document.querySelector('.btn-ambil');
      btn.innerText = "AMBIL NOMOR ANTRIAN SEKARANG"; btn.disabled = false;
    }
  </script>
</body>
</html>
